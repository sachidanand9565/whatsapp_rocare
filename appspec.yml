version: 0.0
os: linux
file_exists_behavior: OVERWRITE
files:
  - source: /
    destination: /home/ec2-user/whatsapp-staging
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: ec2-user
  AfterInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 180
      runas: ec2-user